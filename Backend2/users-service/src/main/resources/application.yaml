server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: users-service
  data:
    redis:
      host: "${SPRING_REDIS_HOST:redis}"
      port: ${SPRING_REDIS_PORT:6379}
      
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/healthcare}"
    username: "${SPRING_DATASOURCE_USERNAME:postgres}"
    password: "${SPRING_DATASOURCE_PASSWORD:123456}"
    driver-class-name: org.postgresql.Driver

  mail:
    host: "${SPRING_MAIL_HOST:smtp.gmail.com}"
    port: ${SPRING_MAIL_PORT:587}
    username: ${MAIL_USERNAME:dummy@example.com}
    password: ${MAIL_PASSWORD:dummy}
    from-name: Team Support
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        debug: ${SPRING_MAIL_DEBUG:false}
  jpa:
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    hibernate: 
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: "${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka}"
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
app:
  mail:
    from-name: "${APP_MAIL_FROM_NAME:Team Support}"
  gateway:
    internal-secret: "${GATEWAY_INTERNAL_SECRET:change-me-in-production}"

jwt:
  access:
    expiration: ${JWT_ACCESS_EXPIRATION:86400000} #1 day to millisecond = 30 * 60 * 1000
    secret: "${JWT_ACCESS_SECRET:S1TZnHDnQS6ojlPYPI+bjd6CXxYhBP/eYmubZsRSANY=}"
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION:1209600000} #14 days to millisecond = 14 * 24 * 60 * 60 * 1000
    secret: "${JWT_REFRESH_SECRET:TaqlmGv1iEDMRiFp/pHuID1+T84IABfuA0xXh4GhiUI=}"
