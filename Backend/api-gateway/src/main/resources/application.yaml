server:
  port: 8080
spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6s

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: S1TZnHDnQS6ojlPYPI+bjd6CXxYhBP/eYmubZsRSANY=

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: users-service
              uri: lb://users-service
              predicates:
                - Path=/api/users/**,/api/auth/**
              
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  gateway:
    internal-secret: ${GATEWAY_INTERNAL_SECRET:change-me}
