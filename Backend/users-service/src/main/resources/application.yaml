server:
  port: 8081
spring:
  application:
    name: users-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/users_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        debug: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  gateway:
    internal-secret: ${GATEWAY_INTERNAL_SECRET:change-me}

jwt:
  access:
    expiration: 1800000 #30 minutes to millisecond = 30 * 60 * 1000
    secret: ${JWT_ACCESS_SECRET:S1TZnHDnQS6ojlPYPI+bjd6CXxYhBP/eYmubZsRSANY=}
  refresh:
    expiration: 1209600000 #14 days to millisecond = 14 * 24 * 60 * 60 * 1000
    secret: ${JWT_REFRESH_SECRET:TaqlmGv1iEDMRiFp/pHuID1+T84IABfuA0xXh4GhiUI=}
