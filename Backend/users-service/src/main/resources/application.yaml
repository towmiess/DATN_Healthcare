server:
  port: 8081
spring:
  application:
    name: users-service

  datasource:
    url: jdbc:postgresql://localhost:5432/users_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
app:
  cors:
    allowed-origins:
      ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  access:
    expiration: 1800000 #30 minutes to millisecond = 30 * 60 * 1000
    secret: S1TZnHDnQS6ojlPYPI+bjd6CXxYhBP/eYmubZsRSANY=
  refresh:
    expiration: 1209600000 #14 days to millisecond = 14 * 24 * 60 * 60 * 1000
    secret: TaqlmGv1iEDMRiFp/pHuID1+T84IABfuA0xXh4GhiUI=