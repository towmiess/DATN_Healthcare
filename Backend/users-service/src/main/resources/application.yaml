server:
  port: 8081
spring:
  application:
    name: users-service

  datasource:
    #    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=UTC
    url: jdbc:mysql://localhost:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: 123456789
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
app:
  cors:
    allowed-origins:
      ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  access:
    expiration: 1800000 #30 minutes to millisecond = 30 * 60 * 1000
    secret: S1TZnHDnQS6ojlPYPI+bjd6CXxYhBP/eYmubZsRSANY=
  refresh:
    expiration: 1209600000 #14 days to millisecond = 14 * 24 * 60 * 60 * 1000
    secret: TaqlmGv1iEDMRiFp/pHuID1+T84IABfuA0xXh4GhiUI=