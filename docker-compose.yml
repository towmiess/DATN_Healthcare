services:
  postgres:
    image: postgres:16-alpine
    container_name: healthcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-users_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-users_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  health-postgres:
    image: postgres:16-alpine
    container_name: healthcare-health-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HEALTH_POSTGRES_DB:-healthcare_db}
      POSTGRES_USER: ${HEALTH_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${HEALTH_POSTGRES_PASSWORD:-123456}
    ports:
      - "${HEALTH_POSTGRES_PORT:-5433}:5432"
    volumes:
      - health_postgres_data:/var/lib/postgresql/data
      - ./RawDB/db.sql:/docker-entrypoint-initdb.d/01-health-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HEALTH_POSTGRES_USER:-postgres} -d ${HEALTH_POSTGRES_DB:-healthcare_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: healthcare-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  discovery-server:
    build:
      context: ./Backend/discovery-server
      dockerfile: Dockerfile
    container_name: healthcare-discovery
    restart: unless-stopped
    ports:
      - "${DISCOVERY_PORT:-8761}:8761"

  users-service:
    build:
      context: ./Backend/users-service
      dockerfile: Dockerfile
    container_name: healthcare-users-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-users_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-change-me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-S1TZnHDnQS6ojlPYPI+bjd6CXxYhBP/eYmubZsRSANY=}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-TaqlmGv1iEDMRiFp/pHuID1+T84IABfuA0xXh4GhiUI=}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "${USERS_SERVICE_PORT:-8081}:8081"

  health-service:
    build:
      context: ./Backend/health-service
      dockerfile: Dockerfile
    container_name: healthcare-health-service
    restart: unless-stopped
    depends_on:
      health-postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${HEALTH_POSTGRES_DB:-healthcare_db}
      POSTGRES_USER: ${HEALTH_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${HEALTH_POSTGRES_PASSWORD:-123456}
      POSTGRES_HOST: health-postgres
      POSTGRES_PORT: 5432
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-change-me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-S1TZnHDnQS6ojlPYPI+bjd6CXxYhBP/eYmubZsRSANY=}
      MODEL_API_URL: ${MODEL_API_URL:-}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}
      GOOGLE_APPLICATION_CREDENTIALS_B64: ${GOOGLE_APPLICATION_CREDENTIALS_B64:-}
    ports:
      - "${HEALTH_SERVICE_PORT:-8100}:8000"

  api-gateway:
    build:
      context: ./Backend/api-gateway
      dockerfile: Dockerfile
    container_name: healthcare-api-gateway
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_started
      users-service:
        condition: service_started
      health-service:
        condition: service_started
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-change-me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-S1TZnHDnQS6ojlPYPI+bjd6CXxYhBP/eYmubZsRSANY=}
      HEALTH_SERVICE_URI: http://health-service:8000
    ports:
      - "${GATEWAY_PORT:-8080}:8080"

  frontend:
    build:
      context: ./Frontend/healthcare
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
        VITE_PREDICTION_API_URL: ${VITE_PREDICTION_API_URL:-http://localhost:8080/api}
    container_name: healthcare-frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres_data:
  health_postgres_data:
  redis_data:
